server:
  shutdown: graceful
logging:
  file:
    name: ${BACKUP_LOG_FILE:./logs/yigongbao-backup-server.log}
  level:
    root: ${BACKUP_LOG_LEVEL:INFO}
spring:
  servlet:
    multipart:
      max-file-size: ${BACKUP_MAX_UPLOAD_SIZE:2GB}
      max-request-size: ${BACKUP_MAX_UPLOAD_SIZE:2GB}
management:
  endpoints:
    web:
      exposure:
        include: health,info
