server:
  port: ${BACKUP_SERVER_PORT:18080}
spring:
  application:
    name: yigongbao-backup-server
  datasource:
    url: ${BACKUP_DB_URL}
    username: ${BACKUP_DB_USERNAME}
    password: ${BACKUP_DB_PASSWORD}
  servlet:
    multipart:
      # 基础配置也必须声明协议层上限；否则未启用 prod profile 时 Spring 默认仅允许 1MB。
      # 具体业务上限仍由数据库 supplement.max-file-size-bytes 控制。
      max-file-size: ${BACKUP_MAX_UPLOAD_SIZE:5GB}
      max-request-size: ${BACKUP_MAX_UPLOAD_SIZE:5GB}
mybatis-plus:
  # 本项目禁止 Mapper XML，SQL 仅允许注解或 MyBatis-Plus Wrapper。
  mapper-locations: []
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0
sa-token:
  token-name: backup-token
  is-concurrent: false
backup:
  execution:
    # 仅允许通过环境变量切换；生产环境必须保持 REAL。
    mode: ${BACKUP_EXECUTION_MODE:REAL}
  simulation:
    # 仅元数据模拟模式使用，必须与正式热备目录隔离。
    root: ${BACKUP_SIMULATION_ROOT:}
