# 仅供显式启用 spring.profiles.active=integration 的真实环境演练使用。
# 所有参数均从环境变量读取，不提供生产凭据默认值。
spring:
  datasource:
    url: ${BACKUP_IT_DB_URL}
    username: ${BACKUP_IT_DB_USERNAME}
    password: ${BACKUP_IT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: ${BACKUP_IT_SERVER_PORT:18081}

backup:
  environment: integration
  online:
    base-url: ${BACKUP_IT_ONLINE_BASE_URL}
    app-id: ${BACKUP_IT_ONLINE_APP_ID}
    app-secret: ${BACKUP_IT_ONLINE_APP_SECRET}
    external-allowed-hosts: ${BACKUP_IT_EXTERNAL_ALLOWED_HOSTS:}
